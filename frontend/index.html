<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced NLP Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
                <h1>NLP Insight</h1>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" title="Toggle Dark Mode">
                    <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Upload Area -->
        <main class="main-content">
            <div class="upload-section glass-card" id="drop-zone">
                <input type="file" id="file-input" accept=".txt,.pdf,.docx,.pptx" hidden>
                <div class="upload-content">
                    <div class="icon-container">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                    <h3>Drag & Drop your document</h3>
                    <p>or <button id="browse-btn" class="text-btn">Browse files</button></p>
                    <span class="support-text">Supported: .TXT, .PDF, .DOCX, .PPTX</span>
                </div>
            </div>

            <!-- Skeleton Loader -->
            <div id="skeleton-loader" class="skeleton-container hidden">
                <div class="metrics-grid">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
                <div class="skeleton-tabs"></div>
                <div class="skeleton-content">
                    <div class="skeleton-line w-100"></div>
                    <div class="skeleton-line w-75"></div>
                    <div class="skeleton-line w-90"></div>
                </div>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="error-banner hidden"></div>

            <!-- Results Dashboard -->
            <div id="results-dashboard" class="dashboard hidden">
                
                <div class="dashboard-header">
                    <h2>Analysis Results</h2>
                    <div class="export-actions">
                        <button id="export-csv" class="primary-btn glass-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="18"/><line x1="15" y1="15" x2="12" y2="18"/></svg>
                            Export CSV
                        </button>
                        <button id="export-pdf" class="primary-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Save as PDF
                        </button>
                    </div>
                </div>

                <!-- Top Row: Metrics -->
                <div class="metrics-grid animate-stagger">
                    <div class="metric-card glass-card">
                        <div class="metric-icon sentiment-icon"></div>
                        <div class="metric-info">
                            <span class="label">Sentiment</span>
                            <h3 id="res-sentiment-type">-</h3>
                            <span class="sub-text" id="res-sentiment-score">-</span>
                        </div>
                    </div>
                    <div class="metric-card glass-card">
                        <div class="metric-icon read-icon"></div>
                        <div class="metric-info">
                            <span class="label">Readability (Flesch)</span>
                            <h3 id="res-readability">-</h3>
                            <span class="sub-text">Grade Level</span>
                        </div>
                    </div>
                    <div class="metric-card glass-card">
                        <div class="metric-icon words-icon"></div>
                        <div class="metric-info">
                            <span class="label">Word Count</span>
                            <h3 id="res-word-count">-</h3>
                            <span class="sub-text" id="res-unique-words">- unique</span>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs-container glass-card animate-stagger" style="animation-delay: 0.1s;">
                    <div class="tab-headers">
                        <button class="tab-btn active" data-tab="summary">Summary</button>
                        <button class="tab-btn" data-tab="highlight">Highlighted Text</button>
                        <button class="tab-btn" data-tab="pos">Parts of Speech</button>
                        <button class="tab-btn" data-tab="wordcloud">Word Cloud</button>
                    </div>
                    
                    <div class="tab-content">
                        <!-- Summary Tab -->
                        <div id="tab-summary" class="tab-pane active fade-in">
                            <h3>Executive Summary</h3>
                            <p id="res-summary" class="summary-text"></p>
                        </div>
                        
                        <!-- Highlight Tab -->
                        <div id="tab-highlight" class="tab-pane hidden">
                            <div id="res-highlight" class="highlight-container"></div>
                        </div>

                        <!-- POS Tab -->
                        <div id="tab-pos" class="tab-pane hidden">
                            <div class="pos-grid">
                                <div class="pos-col">
                                    <h4 class="tag-red">🔴 Nouns</h4>
                                    <ul id="res-nouns" class="pos-list"></ul>
                                </div>
                                <div class="pos-col">
                                    <h4 class="tag-pink">🩷 Verbs</h4>
                                    <ul id="res-verbs" class="pos-list"></ul>
                                </div>
                                <div class="pos-col">
                                    <h4 class="tag-orange">🟫 Adjectives</h4>
                                    <ul id="res-adjectives" class="pos-list"></ul>
                                </div>
                                <div class="pos-col">
                                    <h4 class="tag-blue">🔵 Adverbs</h4>
                                    <ul id="res-adverbs" class="pos-list"></ul>
                                </div>
                                <div class="pos-col keywords-col">
                                    <h4 class="tag-gold">🔑 Keywords</h4>
                                    <ul id="res-keywords" class="pos-list keywords"></ul>
                                </div>
                            </div>
                        </div>

                        <!-- Word Cloud Tab -->
                        <div id="tab-wordcloud" class="tab-pane hidden">
                            <div class="cloud-container">
                                <img id="res-wordcloud" src="" alt="Word Cloud">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
